appId: app.devilwalkx.ingredientalert
name: Auto-lock - after the chosen idle time the app locks itself and the previous person's screen is not shown
---
- launchApp:
    clearState: true
- scrollUntilVisible:
    element: "Try the example kitchen"
    direction: DOWN
    timeout: 60000
    speed: 40
- tapOn: "Try the example kitchen"
- scrollUntilVisible:
    element: "Alex Rivera"
    direction: DOWN
    timeout: 60000
    speed: 40
- tapOn: "Alex Rivera"
- scrollUntilVisible:
    element: "Settings"
    direction: UP
    timeout: 60000
    speed: 40
- tapOn: "Settings"
- scrollUntilVisible:
    element: "Shared device: lock and sign-in"
    direction: DOWN
    timeout: 60000
    speed: 40
- tapOn: "Shared device: lock and sign-in"
- scrollUntilVisible:
    element: "1 minute"
    direction: DOWN
    timeout: 60000
    speed: 40
- tapOn: "1 minute"
- tapOn:
    id: "tab-home"
- scrollUntilVisible:
    element: "Status now"
    direction: DOWN
    timeout: 60000
    speed: 40
- extendedWaitUntil:
    visible: "Who is using the device\\?"
    timeout: 150000
- takeScreenshot: 28-auto-locked
- assertNotVisible: "Status now"
- scrollUntilVisible:
    element: "Alex Rivera"
    direction: DOWN
    timeout: 60000
    speed: 40
- tapOn: "Alex Rivera"
- scrollUntilVisible:
    element: "Status now"
    direction: DOWN
    timeout: 60000
    speed: 40
