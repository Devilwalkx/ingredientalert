appId: app.devilwalkx.ingredientalert
name: Real kitchen - set up with a PIN, keyboard never hides the field or the next action, lock and sign in again
---
- launchApp:
    clearState: true
- scrollUntilVisible:
    element: "Set up my kitchen"
    direction: DOWN
    timeout: 60000
- tapOn: "Set up my kitchen"
- scrollUntilVisible:
    element:
      id: "field-business-or-kitchen-group-name"
    direction: DOWN
    timeout: 60000
- tapOn:
    id: "field-business-or-kitchen-group-name"
- inputText: "Test Cafe"
- takeScreenshot: 15-keyboard-open-setup
- scrollUntilVisible:
    element: "Next"
    direction: DOWN
    timeout: 60000
- tapOn: "Next"
- scrollUntilVisible:
    element:
      id: "field-your-name"
    direction: DOWN
    timeout: 60000
- tapOn:
    id: "field-your-name"
- inputText: "Pat Owner"
- scrollUntilVisible:
    element:
      id: "field-choose-a-pin"
    direction: DOWN
    timeout: 60000
- tapOn:
    id: "field-choose-a-pin"
- inputText: "481516"
- scrollUntilVisible:
    element:
      id: "field-type-the-pin-again"
    direction: DOWN
    timeout: 60000
- tapOn:
    id: "field-type-the-pin-again"
- inputText: "481516"
- takeScreenshot: 16-keyboard-open-pin
- scrollUntilVisible:
    element: "Start my kitchen"
    direction: DOWN
    timeout: 60000
- tapOn: "Start my kitchen"
- scrollUntilVisible:
    element: "Finish setting up"
    direction: DOWN
    timeout: 60000
- assertNotVisible: "Example kitchen.*"
- scrollUntilVisible:
    element: "Lock and switch person"
    direction: UP
    timeout: 60000
- tapOn: "Lock and switch person"
- scrollUntilVisible:
    element: "Pat Owner"
    direction: DOWN
    timeout: 60000
- tapOn: "Pat Owner"
- scrollUntilVisible:
    element:
      id: "field-your-pin"
    direction: DOWN
    timeout: 60000
- tapOn:
    id: "field-your-pin"
- inputText: "000111"
- scrollUntilVisible:
    element: "Unlock"
    direction: DOWN
    timeout: 60000
- tapOn: "Unlock"
- scrollUntilVisible:
    element: "Wrong PIN.*"
    direction: DOWN
    timeout: 60000
- scrollUntilVisible:
    element:
      id: "field-your-pin"
    direction: DOWN
    timeout: 60000
- tapOn:
    id: "field-your-pin"
- eraseText: 6
- inputText: "481516"
- scrollUntilVisible:
    element: "Unlock"
    direction: DOWN
    timeout: 60000
- tapOn: "Unlock"
- scrollUntilVisible:
    element: "Finish setting up"
    direction: DOWN
    timeout: 60000
- takeScreenshot: 17-real-kitchen-home
