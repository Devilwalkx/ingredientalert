appId: app.devilwalkx.ingredientalert
name: Scan finds nothing in the emulator's virtual scene - timeout notice, retry, then manual search
---
- launchApp:
    clearState: true
    permissions:
      camera: allow
- scrollUntilVisible:
    element: "Try the example kitchen"
    direction: DOWN
    timeout: 60000
    speed: 40
- tapOn: "Try the example kitchen"
- scrollUntilVisible:
    element: "Alex Rivera"
    direction: DOWN
    timeout: 60000
    speed: 40
- tapOn: "Alex Rivera"
- scrollUntilVisible:
    element: "Check a delivery.*"
    direction: DOWN
    timeout: 60000
    speed: 40
- tapOn: "Check a delivery.*"
- scrollUntilVisible:
    element:
      id: "field-search-by-name-supplier-or-barcode-number"
    direction: DOWN
    timeout: 60000
    speed: 40
- tapOn:
    id: "field-search-by-name-supplier-or-barcode-number"
- inputText: "teriyaki"
- hideKeyboard
- scrollUntilVisible:
    element: "Harbour Teriyaki Sauce 1L"
    direction: DOWN
    timeout: 60000
    speed: 40
- tapOn: "Harbour Teriyaki Sauce 1L"
- scrollUntilVisible:
    element: "Next: what is on the pack\\?"
    direction: DOWN
    timeout: 60000
    speed: 40
- tapOn: "Next: what is on the pack\\?"
- scrollUntilVisible:
    element: "Scan the barcode"
    direction: DOWN
    timeout: 60000
    speed: 40
- tapOn: "Scan the barcode"
- scrollUntilVisible:
    element: "No barcode was read in 20 seconds.*"
    direction: DOWN
    timeout: 60000
    speed: 40
- takeScreenshot: 18-scan-timeout
- scrollUntilVisible:
    element: "Try scanning again"
    direction: DOWN
    timeout: 60000
    speed: 40
- tapOn: "Try scanning again"
- scrollUntilVisible:
    element: "No barcode was read in 20 seconds.*"
    direction: DOWN
    timeout: 60000
    speed: 40
- scrollUntilVisible:
    element: "Type the number or search instead"
    direction: DOWN
    timeout: 60000
    speed: 40
- tapOn: "Type the number or search instead"
- scrollUntilVisible:
    element:
      id: "field-barcode-number"
    direction: DOWN
    timeout: 60000
    speed: 40
- tapOn:
    id: "field-barcode-number"
- inputText: "4006381333931"
- scrollUntilVisible:
    element: ".*not in your product list.*"
    direction: DOWN
    timeout: 60000
    speed: 40
