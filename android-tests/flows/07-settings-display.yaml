appId: app.devilwalkx.ingredientalert
name: Settings - theme, text size, shared-device lock, build identity
---
- launchApp:
    clearState: true
- tapOn: "Try the example kitchen"
- tapOn: "Alex Rivera"
- tapOn: "Settings"
- assertVisible: "Display"
- takeScreenshot: 13-settings
- scrollUntilVisible:
    element: "About this build"
    direction: DOWN
    timeout: 60000
- tapOn: "About this build"
- scrollUntilVisible:
    element: "App ID.*"
    direction: DOWN
    timeout: 60000
- assertVisible: "app.devilwalkx.ingredientalert"
- takeScreenshot: 14-about-build
