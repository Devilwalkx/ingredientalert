appId: app.devilwalkx.ingredientalert
name: Dark theme chosen inside the app (the emulator's system night mode did not reach the app in an earlier run)
---
- launchApp:
    clearState: true
- scrollUntilVisible:
    element: "Try the example kitchen"
    direction: DOWN
    timeout: 60000
    speed: 85
- tapOn: "Try the example kitchen"
- scrollUntilVisible:
    element: "Alex Rivera"
    direction: DOWN
    timeout: 60000
    speed: 85
- tapOn: "Alex Rivera"
- scrollUntilVisible:
    element: "Settings"
    direction: UP
    timeout: 60000
    speed: 85
- tapOn: "Settings"
- scrollUntilVisible:
    element: "Dark"
    direction: DOWN
    timeout: 60000
    speed: 85
- tapOn: "Dark"
- scrollUntilVisible:
    element: "Display"
    direction: DOWN
    timeout: 60000
    speed: 85
- takeScreenshot: 22-dark-settings
- tapOn:
    id: "tab-home"
- scrollUntilVisible:
    element: "Status now"
    direction: DOWN
    timeout: 60000
    speed: 85
- takeScreenshot: 23-dark-home
